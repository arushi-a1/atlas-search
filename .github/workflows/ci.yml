name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build

      - name: Configure
        run: cmake -S backend -B backend/build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build
        run: cmake --build backend/build --parallel

      - name: Run unit tests
        run: ctest --test-dir backend/build --output-on-failure

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

  docker-build:
    name: Docker image build check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build search-api image
        run: docker build -f backend/Dockerfile -t dse/search-api:ci .

      - name: Build crawl-worker image
        run: docker build -f worker/Dockerfile -t dse/crawl-worker:ci .

      - name: Build frontend image
        run: docker build -t dse/frontend:ci ./frontend
